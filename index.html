<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resultados Lotería</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}

/* TÍTULO */
h1 {
  text-align: center;
  padding: 15px;
  margin: 0;
  background: #222;
  color: white;
}

/* MENÚ */
.menu {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 15px;
  background: #fff;
}

.menu button {
  padding: 14px 20px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
}

.menu button.activo {
  box-shadow: 0 0 0 3px rgba(0,0,0,0.3);
}

/* COLORES */
.btn-fl { background: #dc3545; } /* rojo */
.btn-ga { background: #fd7e14; } /* naranja */
.btn-ny { background: #007bff; } /* azul */

/* CONTENEDOR */
#resultados {
  padding: 15px;
}

/* FRAME SORTEO */
.sorteo {
  background: white;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  padding: 15px;
}

/* GRID */
.sorteo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  text-align: center;
}

/* TEXTO */
.fecha {
  grid-column: span 2;
  font-size: 20px;
  font-weight: bold;
}

.turno {
  font-size: 18px;
  font-weight: bold;
  color: #555;
}

.pick3 {
  font-size: 26px;
  font-weight: bold;
  color: #28a745;
}

.pick4 {
  font-size: 26px;
  font-weight: bold;
  color: #6f42c1;
}
</style>
</head>

<body>

<h1>Resultados de Lotería</h1>

<div class="menu">
  <button class="btn-fl activo" onclick="cargarLoteria('fl')">Florida</button>
  <button class="btn-ga" onclick="cargarLoteria('ga')">Georgia</button>
  <button class="btn-ny" onclick="cargarLoteria('ny')">New York</button>
</div>

<div id="resultados">Cargando...</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  cargarLoteria('fl');
});

function cargarLoteria(codigo) {

  document.querySelectorAll(".menu button")
    .forEach(b => b.classList.remove("activo"));
  document.querySelector(".btn-" + codigo).classList.add("activo");

  document.getElementById("resultados").innerHTML = "Cargando...";

  fetch(`data/resultados_${codigo}.json?v=${Date.now()}`)
    .then(r => r.json())
    .then(data => mostrarResultados(data, codigo))
    .catch(() => {
      document.getElementById("resultados").innerHTML =
        "<p>Error al cargar los datos</p>";
    });
}

function mostrarResultados(data, codigo) {

  if (!Array.isArray(data) || data.length === 0) {
    document.getElementById("resultados").innerHTML =
      "<p>No hay resultados</p>";
    return;
  }

  /*const ordenTurnos = {
    fl: ["Noche", "Dia"],
    ga: ["Noche", "Medio", "Dia"],
    ny: ["Noche", "Medio"]
  };

  data.sort((a, b) => {
    const fa = new Date(a.Fecha);
    const fb = new Date(b.Fecha);
    if (fb - fa !== 0) return fb - fa;

    return ordenTurnos[codigo].indexOf(a.DiaNoche) -
           ordenTurnos[codigo].indexOf(b.DiaNoche);
  });*/

  let html = "";

  data.forEach(r => {
    html += `
      <div class="sorteo">
        <div class="sorteo-grid">
          <div class="fecha">
            ${new Date(r.Fecha).toLocaleDateString("es-ES")}
          </div>
          <div class="turno">
            ${r.DiaNoche === "Medio" ? "Tarde" : r.DiaNoche}
          </div>
          <div></div>
          <div class="pick3">${r.Pick3 ?? "-"}</div>
          <div class="pick4">${r.Pick4 ?? "-"}</div>
        </div>
      </div>
    `;
  });

  document.getElementById("resultados").innerHTML = html;
}
</script>

</body>
</html>
