<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resultados Lotería</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}

/* TÍTULO */
h1 {
  text-align: center;
  padding: 15px;
  margin: 0;
  background: #222;
  color: white;
}

/* MENÚ */
.menu {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 15px;
  background: #fff;
}

.menu button {
  padding: 10px 20px;
  font-size: 18px;
  border: none;
  border-radius: 12px;
  color: white;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}

.menu button img {
  width: 30px;
  height: 30px;
  border-radius: 6px;
}

.menu button.activo {
  box-shadow: 0 0 0 3px rgba(0,0,0,0.3);
}

/* COLORES BOTONES */
.btn-fl { background: #dc3545; }
.btn-ga { background: #fd7e14; }
.btn-ny { background: #007bff; }

/* TEXTO ESTADO SELECCIONADO */
.estado {
  text-align: center;
  font-size: 42px;
  font-weight: bold;
  margin: 10px 0 20px 0;
  letter-spacing: 2px;
  font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  text-transform: uppercase;
  transition: all 0.3s ease;
}

.estado.fl { color: #dc3545; }
.estado.ga { color: #fd7e14; }
.estado.ny { color: #007bff; }

/* CONTENEDOR */
#resultados {
  padding: 15px;
}

/* FRAME SORTEO */
.sorteo {
  background: white;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  padding: 15px;
}

/* GRID */
.sorteo-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  text-align: center;
}

/* TEXTO */
.fecha {
  grid-column: span 2;
  font-size: 50px;
  font-weight: bold;
}

.turno-img {
  grid-column: span 2;
  display: flex;
  justify-content: center;
  margin: 5px 0;
}

.turno-img img {
  width: 60px;
  height: 60px;
}

/* NÚMEROS */
.pick3 {
  font-size: 45px;
  font-weight: bold;
  color: #28a745;
}

.pick4 {
  font-size: 45px;
  font-weight: bold;
  color: #6f42c1;
}
</style>
</head>

<body>

<h1>Resultados de Lotería</h1>

<div class="menu">
  <button class="btn-fl activo" onclick="cargarLoteria('fl')">
    <img src="https://i.ibb.co/fVx4H5s6/fl-sf.png"> Florida
  </button>
  <button class="btn-ga" onclick="cargarLoteria('ga')">
    <img src="https://i.ibb.co/sc9n9fn/ga-sf.png"> Georgia
  </button>
  <button class="btn-ny" onclick="cargarLoteria('ny')">
    <img src="https://i.ibb.co/G3f9CB2n/ny-sf.png"> New York
  </button>
</div>

<!-- TEXTO CAMBIANTE -->
<div id="estadoSeleccionado" class="estado fl">Florida</div>

<div id="resultados">Cargando...</div>

<script>
const turnoImgs = {
  Dia: "https://i.ibb.co/svq4smVL/day.png",
  Noche: "https://i.ibb.co/JF2Yqhs3/noche.png",
  Medio: "https://i.ibb.co/1JwnStXg/tarde.png"
};

const nombres = {
  fl: "Florida",
  ga: "Georgia",
  ny: "New York"
};

document.addEventListener("DOMContentLoaded", () => {
  cargarLoteria('fl');
});

function cargarLoteria(codigo) {

  // Botón activo
  document.querySelectorAll(".menu button")
    .forEach(b => b.classList.remove("activo"));
  document.querySelector(".btn-" + codigo).classList.add("activo");

  // Texto debajo del menú
  const estado = document.getElementById("estadoSeleccionado");
  estado.textContent = nombres[codigo];
  estado.className = "estado " + codigo;

  document.getElementById("resultados").innerHTML = "Cargando...";

  fetch(`data/resultados_${codigo}.json?v=${Date.now()}`)
    .then(r => r.json())
    .then(data => mostrarResultados(data))
    .catch(() => {
      document.getElementById("resultados").innerHTML =
        "<p>Error al cargar los datos</p>";
    });
}

function mostrarResultados(data) {

  if (!Array.isArray(data) || data.length === 0) {
    document.getElementById("resultados").innerHTML =
      "<p>No hay resultados</p>";
    return;
  }

  let html = "";

  data.forEach(r => {
    const turno = r.DiaNoche === "Medio" ? "Medio" : r.DiaNoche;
    const imgTurno = turnoImgs[turno] || "";

    html += `
      <div class="sorteo">
        <div class="sorteo-grid">
          <div class="fecha">
            ${new Date(r.Fecha).toLocaleDateString("es-ES")}
          </div>
          <div class="turno-img">
            <img src="${imgTurno}">
          </div>
          <div class="pick3">${r.Pick3 ?? "-"}</div>
          <div class="pick4">${r.Pick4 ?? "-"}</div>
        </div>
      </div>
    `;
  });

  document.getElementById("resultados").innerHTML = html;
}
</script>

</body>
</html>
