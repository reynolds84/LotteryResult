<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resultados de Lotería</title>

<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f2f2f2;
  margin: 0;
}

h1 {
  text-align: center;
  color: red;
  font-size: 28px;
  margin: 15px 0;
}

/* MENÚ */
.menu {
  display: flex;
  justify-content: center;
  gap: 10px;
  padding: 10px;
}

.menu button {
  padding: 12px 18px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  background: #007bff;
  color: white;
  cursor: pointer;
}

.menu button:hover {
  background: #0056b3;
}

/* RESULTADOS */
#resultados {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 10px;
}

/* TARJETA */
.sorteo {
  background: white;
  width: 95%;
  max-width: 430px;
  border-radius: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,.25);
  padding: 14px;
}

.destacado {
  border: 3px solid orange;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  text-align: center;
}

.header {
  font-size: 18px;
  font-weight: bold;
}

.fecha {
  font-size: 16px;
  color: #444;
}

.pick3 {
  font-size: 26px;
  font-weight: bold;
  color: #1e7e34;
}

.pick4 {
  font-size: 28px;
  font-weight: bold;
  color: #5a189a;
}

.noche {
  background: #fff3cd;
  border-radius: 8px;
  padding: 6px 0;
}

.dia {
  background: #d1ecf1;
  border-radius: 8px;
  padding: 6px 0;
}
</style>
</head>

<body>

<h1>Resultados de Lotería</h1>

<div class="menu">
  <button onclick="cargarLoteria('fl')">Florida</button>
  <button onclick="cargarLoteria('ga')">Georgia</button>
  <button onclick="cargarLoteria('ny')">New York</button>
</div>

<div id="resultados">Cargando...</div>

<script>
function cargarLoteria(codigo) {
  document.getElementById("resultados").innerHTML = "Cargando...";

  fetch(`data/resultados_${codigo}.json?v=${Date.now()}`)
    .then(r => r.json())
    .then(data => mostrarResultados(data))
    .catch(() => {
      document.getElementById("resultados").innerHTML =
        "<p>Error cargando datos</p>";
    });
}

function mostrarResultados(data) {

  if (!Array.isArray(data) || data.length === 0) {
    document.getElementById("resultados").innerHTML =
      "<p>No hay resultados</p>";
    return;
  }

  const fechas = {};
  data.forEach(r => {
    if (!fechas[r.Fecha]) fechas[r.Fecha] = {};
    fechas[r.Fecha][r.DiaNoche] = r; // Dia / Noche
  });

  const ordenadas = Object.keys(fechas)
    .sort((a,b) => new Date(b) - new Date(a));

  let html = "";

  ordenadas.forEach((fecha, i) => {
    const noche = fechas[fecha]["Noche"];
    const dia   = fechas[fecha]["Dia"];

    html += `
      <div class="sorteo ${i === 0 ? "destacado" : ""}">
        <div class="grid">
          <div class="header">Noche</div>
          <div class="header">Día</div>

          <div class="noche fecha">${noche ? fechaFormateada(noche.Fecha) : "-"}</div>
          <div class="dia fecha">${dia ? fechaFormateada(dia.Fecha) : "-"}</div>

          <div class="noche pick3">${noche ? noche.Pick3 : "-"}</div>
          <div class="dia pick3">${dia ? dia.Pick3 : "-"}</div>

          <div class="noche pick4">${noche ? noche.Pick4 : "-"}</div>
          <div class="dia pick4">${dia ? dia.Pick4 : "-"}</div>
        </div>
      </div>
    `;
  });

  document.getElementById("resultados").innerHTML = html;
}

function fechaFormateada(f) {
  return new Date(f).toLocaleDateString("es-ES");
}

// Florida por defecto
document.addEventListener("DOMContentLoaded", () => {
  cargarLoteria("fl");
});
</script>

</body>
</html>
