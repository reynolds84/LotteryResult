<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resultados Lotería Florida</title>
<style>
body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
  margin: 0;
  padding: 0;
}

h1 {
  text-align: center;
  color: red;
  margin: 20px 0;
}

#resultados {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
  padding: 10px;
}

/* Tarjeta del sorteo */
.sorteo {
  background-color: white;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  padding: 10px;
  width: 320px;
}

/* Grid interno: 4 filas, 2 columnas */
.sorteo .grid {
  display: grid;
  grid-template-columns: 1fr 1fr; /* dos columnas: Noche y Día */
  row-gap: 5px;
  text-align: center;
}

/* Encabezados de fila */
.sorteo .grid .header {
  font-weight: bold;
  color: #333;
}

/* Noche y Día colores */
.noche {
  background-color: #ffecb3;
  border-radius: 4px;
  padding: 3px 0;
}

.dia {
  background-color: #cce5ff;
  border-radius: 4px;
  padding: 3px 0;
}

/* Pick3 y Pick4 colores */
.noche .pick3 { color: #28a745; font-weight: bold; }
.noche .pick4 { color: #6f42c1; font-weight: bold; }

.dia .pick3 { color: #155724; font-weight: bold; }
.dia .pick4 { color: #721c24; font-weight: bold; }

/* Sorteo destacado */
.sorteo.destacado {
  border: 2px solid orange;
}
</style>
</head>
<body>

<h1>Resultados Lotería Florida</h1>

<div id="resultados">Cargando resultados...</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  fetch("resultados_fl.json?v=" + Date.now())
    .then(res => {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.text();
    })
    .then(text => {
      const data = JSON.parse(text);
      mostrarResultados(data);
    })
    .catch(err => {
      console.error(err);
      document.getElementById("resultados").innerHTML =
        "<p>Error al cargar los resultados</p>";
    });

  function mostrarResultados(data) {

    if (!Array.isArray(data) || data.length === 0) {
      document.getElementById("resultados").innerHTML =
        "<p>No hay resultados disponibles</p>";
      return;
    }

    // Agrupar por fecha
    const fechas = {};
    data.forEach(r => {
      if (!fechas[r.Fecha]) fechas[r.Fecha] = {};
      fechas[r.Fecha][r.DiaNoche] = r;
    });

    // Orden descendente por fecha
    const fechasOrdenadas = Object.keys(fechas).sort((a,b) => new Date(b) - new Date(a));

    let html = "";
    fechasOrdenadas.forEach((fecha, idx) => {
      const noche = fechas[fecha]["Noche"];
      const dia = fechas[fecha]["Día"];

      html += `
        <div class="sorteo ${idx === 0 ? "destacado" : ""}">
          <div class="grid">
            <!-- Encabezados -->
            <div class="header">Noche</div>
            <div class="header">Día</div>

            <!-- Fecha -->
            <div class="noche">${noche ? new Date(noche.Fecha).toLocaleDateString("es-ES") : "-"}</div>
            <div class="dia">${dia ? new Date(dia.Fecha).toLocaleDateString("es-ES") : "-"}</div>

            <!-- Pick3 -->
            <div class="noche pick3">${noche ? noche.Pick3 : "-"}</div>
            <div class="dia pick3">${dia ? dia.Pick3 : "-"}</div>

            <!-- Pick4 -->
            <div class="noche pick4">${noche ? noche.Pick4 : "-"}</div>
            <div class="dia pick4">${dia ? dia.Pick4 : "-"}</div>
          </div>
        </div>
      `;
    });

    document.getElementById("resultados").innerHTML = html;
  }

});
</script>

</body>
</html>
